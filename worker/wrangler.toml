name = "aimoney-research"
main = "src/index.js"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Research cadence: PAUSED since 2026-10-16 (owner decision: the agent's
# proposals were noise and the review queue had stalled it since 4 Oct).
# An empty list removes every cron trigger on deploy, so the agent never runs
# on its own; an admin POST /run still does a one-off pass. To resume, restore
# the 6-hourly schedule "0 */6 * * *" here and in deploy/worker-delivery.json
# and .mjs, then run: wrangler triggers deploy --config worker/wrangler.toml
[triggers]
crons = []

[[d1_databases]]
binding = "DB"
database_name = "aimoney"
database_id = "5f04098c-cb7c-4464-b8ae-e9063392ab70"

[ai]
binding = "AI"

# Manual runs: set once, never commit the value.
#   wrangler secret put ADMIN_TOKEN --config worker/wrangler.toml
# Same value as the Pages ADMIN_TOKEN env var so one token drives the dashboard.
