name: Deploy research worker

on:
  push:
    branches: [master]
    paths:
      - "worker/**"
      - "d1/**"
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g wrangler
      - name: Fail fast when Cloudflare secrets are empty
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CF_API_TOKEN is empty - add it in Settings > Secrets > Actions"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CF_ACCOUNT_ID is empty - add it in Settings > Secrets > Actions"; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      - run: wrangler d1 execute aimoney --file=d1/schema.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      # Mirror of the deploy/deploy.sh D1 migration loop (sorted glob, same
      # tolerate-list): keep both in sync so CI and manual deploys converge.
      - name: Apply D1 migrations in sorted order
        run: |
          for f in d1/migrate-*.sql; do
            [ -e "$f" ] || continue
            echo "==> D1: migration $f"
            if out=$(wrangler d1 execute aimoney --file="$f" --remote 2>&1); then
              echo "$out"
            else
              case "$(printf '%s' "$out" | tr '[:upper:]' '[:lower:]')" in
                *"duplicate column"*|*"already exists"*)
                  echo "==> D1: $f already applied (continuing)" ;;
                *)
                  echo "$out"
                  echo "::error::D1 migration $f failed (not a duplicate-column no-op)"
                  exit 1 ;;
              esac
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      - run: wrangler deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
