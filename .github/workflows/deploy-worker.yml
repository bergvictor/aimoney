name: Deploy research worker

on:
  push:
    branches: [master]
    paths:
      - "worker/**"
      - "d1/**"
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g wrangler
      - name: Fail fast when Cloudflare secrets are empty
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CF_API_TOKEN is empty - add it in Settings > Secrets > Actions"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CF_ACCOUNT_ID is empty - add it in Settings > Secrets > Actions"; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      - run: wrangler d1 execute aimoney --file=d1/schema.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      # D1 migrations run via the shared deploy/apply-d1-migrations.sh (same file
      # deploy/deploy.sh calls) so CI and manual deploys converge.
      - name: Apply D1 migrations in sorted order
        run: ./deploy/apply-d1-migrations.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      # Worker rev runs via the shared deploy/stamp-worker-rev.sh (same file
      # deploy/deploy.sh calls) so CI and manual deploys converge.
      - name: Stamp worker revision
        run: ./deploy/stamp-worker-rev.sh ${{ github.sha }}
      - run: wrangler deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
